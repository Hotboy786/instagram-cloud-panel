name: InstagramStudio
options:
  bundleIdPrefix: com.madara
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  InstagramStudio:
    type: application
    platform: iOS
    sources:
      - path: InstagramStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madara.instagramstudio.ios
        PRODUCT_NAME: InstagramStudio
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  InstagramStudio:
    build:
      targets:
        InstagramStudio: all
